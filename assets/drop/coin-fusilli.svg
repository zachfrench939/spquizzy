<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <title>Fusilli coin (in-game token)</title>
  <!-- Hard neo-brutalist shadow -->
  <ellipse cx="90" cy="94" rx="58" ry="55" fill="#111111"/>
  <!-- Thickness / darker gold -->
  <ellipse cx="78" cy="86" rx="58" ry="55" fill="#111111"/>
  <ellipse cx="76" cy="84" rx="56" ry="53" fill="#C49214"/>
  <!-- Milled ridges on the visible edge -->
  <g stroke="#111111" stroke-width="2.5" stroke-linecap="butt">
    <line x1="28" y1="98" x2="30.5" y2="113"/>
    <line x1="36" y1="107" x2="39" y2="121"/>
    <line x1="46" y1="115" x2="50" y2="127"/>
    <line x1="58" y1="121" x2="62" y2="133"/>
    <line x1="70" y1="125" x2="74" y2="136"/>
    <line x1="82" y1="126" x2="86" y2="137"/>
    <line x1="94" y1="125" x2="99" y2="136"/>
    <line x1="106" y1="121" x2="112" y2="132"/>
    <line x1="116" y1="113" x2="124" y2="124"/>
    <line x1="124" y1="102" x2="133.5" y2="114"/>
    <line x1="129" y1="90" x2="139" y2="100"/>
    <line x1="130" y1="78" x2="140" y2="86"/>
    <line x1="128" y1="66" x2="138" y2="72"/>
  </g>
  <!-- Face -->
  <ellipse cx="72" cy="74" rx="56" ry="53" fill="#FBBF36" stroke="#111111" stroke-width="5.5"/>
  <ellipse cx="72" cy="74" rx="47" ry="44" fill="none" stroke="#111111" stroke-width="2" opacity="0.28"/>
  <!-- Fusilli: 5-segment corkscrew, union-outline technique -->
  <g transform="translate(72,76) rotate(-40) translate(-72,-76)">
    <!-- black outline blobs (slightly larger) -->
    <g fill="#111111">
      <circle cx="40" cy="86" r="13.6"/>
      <circle cx="54" cy="74" r="14.4"/>
      <circle cx="70" cy="66" r="14.6"/>
      <circle cx="86" cy="62" r="14.2"/>
      <circle cx="101" cy="64" r="13.2"/>
    </g>
    <!-- yellow fill -->
    <g fill="#FBBF36">
      <circle cx="40" cy="86" r="10.4"/>
      <circle cx="54" cy="74" r="11.2"/>
      <circle cx="70" cy="66" r="11.4"/>
      <circle cx="86" cy="62" r="11.0"/>
      <circle cx="101" cy="64" r="10.0"/>
    </g>
    <!-- ridge cuts between segments -->
    <g fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round">
      <path d="M48 80 C50.5 84 50 88 48 92"/>
      <path d="M63 70 C66 75 65 81 63 86"/>
      <path d="M79 64 C82 69 81 75 79 80"/>
      <path d="M94 62 C97 67 96 73 94 78"/>
    </g>
    <!-- highlights -->
    <g fill="#FFF4C8">
      <ellipse cx="37" cy="81" rx="4.2" ry="2.6" transform="rotate(-38 37 81)"/>
      <ellipse cx="51" cy="69" rx="4.6" ry="2.7" transform="rotate(-38 51 69)"/>
      <ellipse cx="67" cy="61" rx="4.6" ry="2.7" transform="rotate(-38 67 61)"/>
      <ellipse cx="83" cy="57" rx="4.4" ry="2.6" transform="rotate(-38 83 57)"/>
      <ellipse cx="98" cy="59" rx="3.8" ry="2.3" transform="rotate(-38 98 59)"/>
    </g>
  </g>
</svg>
