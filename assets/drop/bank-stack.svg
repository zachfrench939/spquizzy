<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <title>Fusilli coin stack (bank / balance)</title>
  <!-- Hard shadow -->
  <ellipse cx="90" cy="128" rx="62" ry="16" fill="#111111"/>

  <!-- BOTTOM COIN -->
  <g>
    <!-- thickness fill + outline -->
    <ellipse cx="82" cy="112" rx="58" ry="22" fill="#111111"/>
    <ellipse cx="80" cy="108" rx="56" ry="20" fill="#C49214"/>
    <g stroke="#111111" stroke-width="2.3" stroke-linecap="butt">
      <line x1="30" y1="108" x2="30" y2="122"/>
      <line x1="40" y1="112" x2="40" y2="126"/>
      <line x1="52" y1="116" x2="52" y2="128"/>
      <line x1="64" y1="118" x2="64" y2="130"/>
      <line x1="76" y1="119" x2="76" y2="131"/>
      <line x1="88" y1="119" x2="88" y2="131"/>
      <line x1="100" y1="118" x2="100" y2="130"/>
      <line x1="112" y1="115" x2="112" y2="127"/>
      <line x1="124" y1="110" x2="124" y2="123"/>
    </g>
    <!-- slim visible face of the lower coin -->
    <ellipse cx="80" cy="100" rx="56" ry="20" fill="#E8A81C" stroke="#111111" stroke-width="5"/>
  </g>

  <!-- TOP COIN (slightly left and up) -->
  <g>
    <ellipse cx="80" cy="86" rx="58" ry="22" fill="#111111"/>
    <ellipse cx="78" cy="82" rx="56" ry="20" fill="#C49214"/>
    <g stroke="#111111" stroke-width="2.3" stroke-linecap="butt">
      <line x1="28" y1="82" x2="28" y2="96"/>
      <line x1="38" y1="86" x2="38" y2="100"/>
      <line x1="50" y1="90" x2="50" y2="102"/>
      <line x1="62" y1="92" x2="62" y2="104"/>
      <line x1="74" y1="93" x2="74" y2="105"/>
      <line x1="86" y1="93" x2="86" y2="105"/>
      <line x1="98" y1="92" x2="98" y2="104"/>
      <line x1="110" y1="89" x2="110" y2="101"/>
      <line x1="122" y1="84" x2="122" y2="97"/>
    </g>
    <!-- plump face, seen more from above than the in-game coin -->
    <ellipse cx="78" cy="72" rx="56" ry="26" fill="#FBBF36" stroke="#111111" stroke-width="5.5"/>
    <ellipse cx="78" cy="72" rx="46" ry="18" fill="none" stroke="#111111" stroke-width="2" opacity="0.28"/>
    <!-- smaller, tidier fusilli -->
    <g transform="translate(78,72) rotate(-22) scale(0.78) translate(-78,-72)">
      <g fill="#111111">
        <circle cx="50" cy="78" r="12.8"/>
        <circle cx="64" cy="70" r="13.4"/>
        <circle cx="79" cy="66" r="13.6"/>
        <circle cx="94" cy="68" r="13.0"/>
        <circle cx="107" cy="74" r="12.2"/>
      </g>
      <g fill="#FBBF36">
        <circle cx="50" cy="78" r="9.6"/>
        <circle cx="64" cy="70" r="10.2"/>
        <circle cx="79" cy="66" r="10.4"/>
        <circle cx="94" cy="68" r="9.8"/>
        <circle cx="107" cy="74" r="9.0"/>
      </g>
      <g fill="none" stroke="#111111" stroke-width="2.3" stroke-linecap="round">
        <path d="M57 73 C60 77 59 83 57 87"/>
        <path d="M71 66 C74 71 73 77 71 82"/>
        <path d="M87 66 C90 71 89 77 87 82"/>
        <path d="M101 71 C104 75 103 80 101 84"/>
      </g>
      <g fill="#FFF4C8">
        <ellipse cx="47" cy="74" rx="3.8" ry="2.3" transform="rotate(-24 47 74)"/>
        <ellipse cx="61" cy="66" rx="4.2" ry="2.4" transform="rotate(-24 61 66)"/>
        <ellipse cx="76" cy="62" rx="4.2" ry="2.4" transform="rotate(-24 76 62)"/>
        <ellipse cx="91" cy="64" rx="3.8" ry="2.3" transform="rotate(-24 91 64)"/>
      </g>
    </g>
  </g>
</svg>
